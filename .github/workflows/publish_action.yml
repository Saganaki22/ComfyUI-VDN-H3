name: Publish ComfyUI Node

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

jobs:
  publish-node:
    name: Publish Node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
